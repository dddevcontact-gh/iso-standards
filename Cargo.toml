[package]
name = "rust-hello-world"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
vercel_runtime = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Each handler must be listed as its own [[bin]] with a unique name
[[bin]]
name = "random_terms"
path = "api/random_terms.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3